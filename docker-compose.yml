services:
    php:
        image: php:8.5-cli-alpine
        working_dir: /app
        volumes:
            - ./:/app:cached
        user: ${HOST_UID}:${HOST_GID}
        env_file:
            - .env

    composer:
        image: composer:latest
        volumes:
            - ./:/app:cached
        user: ${HOST_UID}:${HOST_GID}
        env_file:
            - .env
